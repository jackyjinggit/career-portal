<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 页面不存在</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #060d1a;
    color: #d8e0ef;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { text-align: center; padding: 40px; }
  .code { font-size: 96px; font-weight: 800; color: #2f6df6; letter-spacing: 4px; }
  .msg { font-size: 18px; color: #8fa3c8; margin: 16px 0 32px; }
  a {
    color: #2f6df6; text-decoration: none;
    border: 1px solid #2f6df6; padding: 10px 28px; border-radius: 8px;
    font-size: 14px; transition: all .2s;
  }
  a:hover { background: #2f6df6; color: #060d1a; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="msg">页面不存在或已移动。</div>
    <a href="./index.html">← 返回主页</a>
  </div>
</body>
</html>
