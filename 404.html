<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 页面不存在</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #060d1a;
    color: #d8e0ef;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { text-align: center; padding: 40px; }
  .code { font-size: 96px; font-weight: 800; color: #2f6df6; letter-spacing: 4px; }
  .msg { font-size: 18px; color: #8fa3c8; margin: 16px 0 32px; }
  a {
    color: #2f6df6; text-decoration: none;
    border: 1px solid #2f6df6; padding: 10px 28px; border-radius: 8px;
    font-size: 14px; transition: all .2s;
  }
  a:hover { background: #2f6df6; color: #060d1a; }
</style>
<style>

  /* ===== 同态美化 overlay · 品牌站 v1.2 锚（2026-10-02 · 只动样式层，结构零改动） ===== */
  :root{ --card:rgba(125,205,250,.07); }
  body{
    background:
      radial-gradient(1100px 620px at 82% -8%, rgba(79,195,247,.22), transparent 62%),
      radial-gradient(820px 480px at 4% 16%, rgba(255,213,79,.09), transparent 55%),
      linear-gradient(180deg, #0b1424 0%, #10213c 55%, #0b1626 100%);
    background-attachment: fixed;
  }
  .bg-grid{ opacity:.7;
    background-image:
      linear-gradient(rgba(79,195,247,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,195,247,.06) 1px, transparent 1px); }
  .hero{ position:relative; isolation:isolate;
    background:linear-gradient(135deg,#0e1830 0%,#12264a 100%); }
  .hero::before{
    content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(560px 300px at 50% -10%, rgba(79,195,247,.3), transparent 70%),
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0/100% 40px,
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0/40px 100%;
    -webkit-mask-image:radial-gradient(ellipse at 50% 0%, #000 30%, transparent 78%);
    mask-image:radial-gradient(ellipse at 50% 0%, #000 30%, transparent 78%);
  }
  .card, .hero{
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    box-shadow:0 2px 10px rgba(2,6,23,.35);
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:rgba(79,195,247,.55);
    box-shadow:0 14px 36px rgba(2,6,23,.5), 0 0 24px -6px rgba(79,195,247,.35);
  }
  .cta{ box-shadow:0 8px 24px -8px rgba(79,195,247,.55); }
  .cta:hover{ transform:translateY(-2px); filter:brightness(1.06); box-shadow:0 12px 32px -8px rgba(79,195,247,.7); }
  @keyframes fadeUpPortal{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  .card{ animation:fadeUpPortal .5s ease both; }
  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; }
    .card:hover, .cta:hover{ transform:none; }
  }

</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="msg">页面不存在或已移动。</div>
    <a href="./index.html">← 返回主页</a>
  </div>
</body>
</html>
